name: Dependency Diff (Comment)

on:
  workflow_run:
    workflows: ['Dependency Diff (Analyze)']
    types:
      - completed

jobs:
  post_comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e18e-diff-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post Comment
        uses: e18e/action-dependency-diff@9a7f09f5f2993256322e0db17ee4c8d9339dab77 # v1.7.1
        with:
          mode: comment-from-artifact
          artifact-path: e18e-diff-result.json
